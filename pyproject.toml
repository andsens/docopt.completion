[tool.poetry]
name = "docopt-completion"
description = "A completion for the docopt language"
version = "0.0.0-dev"
authors = ["Anders Ingemann <anders@ingemann.de>"]
license = "MIT"
readme = "docs/README.pypi.md"
homepage = "https://github.com/andsens/docopt.completion"
repository = "https://github.com/andsens/docopt.completion"
classifiers = [
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
]
packages = [
  { include = "docopt_completion" },
  { include = "docopt_completion/py.typed" },
]

[tool.flake8]
max-line-length = 120
ignore = "E111,E114,E121,W503,E302,E303,E305"

[tool.poetry.dependencies]
python = ">=3.11.0,<4.0"
docopt = "^0.6.2"
termcolor = "^1.1.0"
pyyaml = "^6.0"
docopt-parser = "^0.0.1"

[tool.poetry.dev-dependencies]
flake8 = "^6.0.0"
flake8-pyproject = "^1.1.0.post0"
pytest = "^7.1.1"
pyright = "^1.1.238"
types-docopt = "^0.6.11"

[tool.poetry.scripts]
docopt-completion = "docopt_completion.__main__:main"

[tool.pyright]
include = ["docopt_completion", "tests"]
typeCheckingMode = "strict"
exclude = [ ".venv" ]
venvPath = "."
venv = ".venv"

[build-system]
requires = ["poetry_core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
